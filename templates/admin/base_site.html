{% extends "admin/base.html" %}

{% block extrastyle %}
<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        background: #f5f7fb !important;
    }

    body,
    body * {
        font-family: "Vazirmatn", sans-serif !important;
    }

    #container {
        background: transparent !important;
    }

    #content {
        padding: 24px 28px 40px !important;
    }

    .breadcrumbs {
        margin: 0 28px !important;
        padding: 12px 18px !important;
        border: 1px solid rgba(255, 255, 255, 0.9) !important;
        border-radius: 14px !important;
        background: rgba(255, 255, 255, 0.72) !important;
        color: #64748b !important;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04) !important;
    }

    .breadcrumbs a {
        color: #2563eb !important;
    }

    #content h1 {
        margin: 0 0 22px;
        color: #111827;
        font-size: 24px;
        font-weight: 800;
    }

    .module,
    .submit-row,
    fieldset,
    .aligned label + p,
    .form-row {
        border: 1px solid rgba(255, 255, 255, 0.9) !important;
        border-radius: 16px !important;
        background: rgba(255, 255, 255, 0.72) !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05) !important;
    }

    .module caption,
    .module h2,
    .module thead th {
        background: rgba(38, 101, 132, 0.92) !important;
        color: #ffffff !important;
    }

    table {
        border-radius: 16px;
        overflow: hidden;
    }

    th,
    td {
        border-color: rgba(148, 163, 184, 0.2) !important;
    }

    input,
    select,
    textarea {
        border: 1px solid #dbe3ec !important;
        border-radius: 10px !important;
        background: rgba(255, 255, 255, 0.88) !important;
        color: #1f2937 !important;
    }

    .button,
    input[type="submit"],
    input[type="button"],
    .submit-row input {
        border: 0 !important;
        border-radius: 10px !important;
        background: rgba(37, 99, 235, 0.1) !important;
        color: #1d4ed8 !important;
        font-family: inherit !important;
    }

    .button.default,
    .submit-row input.default {
        background: #2563eb !important;
        color: #ffffff !important;
    }

    /* ==============================
       Header
       ============================== */

    #header {
        background: transparent !important;
        padding: 12px 16px !important;
        border: none !important;
        box-shadow: none !important;
    }


    /* ==============================
       نوار شیشه‌ای
       ============================== */

    .my-header {
        width: 100%;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 22px;

        box-sizing: border-box;

        direction: rtl;

        background: rgba(255, 255, 255, 0.8);

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);

        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;

        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }


    /* ==============================
       نام سایت
       ============================== */

    .my-header-right {

        display: flex;
        align-items: center;

        flex: 1;
    }

.my-logo {
    display: flex;
    align-items: center;

    color: #111827 !important;

    text-decoration: none !important;

    font-size: 19px;
    font-weight: 700;

    white-space: nowrap;
}

.my-logo:hover {
    color: #2563eb !important;
}


    /* ==============================
       بخش کاربر
       ============================== */

    .my-header-left {

        display: flex;
        align-items: center;

        justify-content: flex-end;

        gap: 10px;

        flex: 1;
    }


    /* سلام */

    .my-user {

        display: flex;
        align-items: center;

        padding: 8px 12px;

        border-radius: 10px;

        color: #374151;

        background: rgba(0, 0, 0, 0.035);

        white-space: nowrap;
    }


    /* ==============================
       خروج
       ============================== */

    .my-header-left form {

        display: flex;
        align-items: center;

        margin: 0;
    }

    .my-header-left button {

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 8px 14px;

        border: none;
        border-radius: 10px;

        background: rgba(239, 68, 68, 0.08);

        color: #dc2626;

        font-family: inherit;
        font-size: 14px;

        cursor: pointer;

        transition: 0.2s ease;
    }

    .my-header-left button:hover {

        background: rgba(239, 68, 68, 0.15);

        transform: translateY(-1px);
    }


    /* ==============================
       موبایل
       ============================== */

    @media (max-width: 700px) {

        #header {
            padding: 8px !important;
        }

        .my-header {
            padding: 0 14px;
        }

    }

</style>
{% endblock %}


{% block header %}

<header id="header">

    <div class="my-header">

        <!-- نام سایت -->

        <div class="my-header-right">

            <a
                href="{% url 'admin:index' %}"
                class="my-logo"
            >
                همدرس
            </a>

        </div>


        <!-- کاربر -->

        <div class="my-header-left">

            <span class="my-user">
                سلام، {{ user.get_username }}
            </span>

            <form
                method="post"
                action="{% url 'admin:logout' %}"
            >

                {% csrf_token %}

                <button type="submit">
                    خروج
                </button>

            </form>

        </div>

    </div>

</header>

{% endblock %}
